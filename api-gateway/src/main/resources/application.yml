server:
  port: 9090

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authentication-service
              uri: lb://authentication-service
              predicates:
                - Path=/auth/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/commerce/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
              - Path=/payments/**

      discovery:
        locator:
          lower-case-service-id: true

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

test:
  value: hello-gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG